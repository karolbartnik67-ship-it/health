```yaml
name: Build HeartBar mod

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            found=""
            for file in */settings.gradle */settings.gradle.kts */build.gradle */build.gradle.kts; do
              if [ -f "$file" ]; then
                found="${file%/*}"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "Nie znaleziono plikow Gradle."
              ls -la
              exit 1
            fi
            echo "dir=$found" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeartBar-Fabric-1.21.4
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
```
