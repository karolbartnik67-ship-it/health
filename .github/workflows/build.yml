
name: Build HeartBar mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show files
        run: ls -la

      - name: Build mod
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon build
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle --no-daemon build
          else
            echo "Nie znaleziono projektu Gradle w glownym folderze."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeartBar-Fabric-1.21.4
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
