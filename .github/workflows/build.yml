name: Build HeartBar mod

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ustaw Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Zbuduj moda
        working-directory: heartbar-fabric-1.21.4
        run: gradle --no-daemon build

      - name: Udostępnij pliki JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeartBar-Fabric-1.21.4
          path: heartbar-fabric-1.21.4/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
